[project]
name = "prompt-forge"
version = "0.1.0"
description = "Streamlit + OpenAI: turns a project definition into a Claude Code prompt grounded in the dev-toolkit skills"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.39",
  "openai>=1.50",
  "anthropic>=1.12",
  "pyyaml>=6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
